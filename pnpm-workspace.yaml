packages:
  - apps/*
  - packages/*
  - .claude/skills

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild
  - msw
  - protobufjs
  - sharp

# Storybook's Next plugin skips vite-tsconfig-paths, and with it tsconfck, on
# Vite 8, so tsconfck's TypeScript 5 peer requirement doesn't matter.
peerDependencyRules:
  allowedVersions:
    tsconfck>typescript: '7'

# Waiting a week lets compromised or broken releases be pulled before we pick
# them up. Dependabot's cooldown only holds back the direct dependencies it
# bumps, so this makes pnpm skip any version under a week old, indirect ones
# included.
#
# To take an urgent security fix sooner, list the package under
# minimumReleaseAgeExclude and update it. If it's an indirect dependency, also
# add an overrides entry here (e.g. some-package: '>=1.2.4') to force the
# patched version. Remove both once the release is a week old.
minimumReleaseAge: 10080
