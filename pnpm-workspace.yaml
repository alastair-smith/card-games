packages:
  - apps/*
  - packages/*
  - .claude/skills

onlyBuiltDependencies:
  - '@swc/core'
  - '@tailwindcss/oxide'
  - esbuild
  - msw
  - protobufjs
  - sharp

# Dependabot's cooldown only holds back the direct dependencies it bumps, so
# this makes pnpm skip any version under a week old, indirect ones included.
minimumReleaseAge: 10080
