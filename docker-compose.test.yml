services:
  app:
    image: card-games:ci
    environment:
      NODE_ENV: production
      REDIS_CONNECTION_STRING: redis://redis:6379
      AUTH_SECRET: ${AUTH_SECRET:-test-secret-at-least-32-characters-long!!}
    ports:
      - '3000:3000'
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        ['CMD-SHELL', 'wget -qO- http://localhost:3000/api/healthcheck || exit 1']
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
