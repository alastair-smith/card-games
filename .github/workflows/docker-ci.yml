name: Docker CI

on:
  - pull_request

jobs:
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t card-games:ci .

      - name: Export image
        run: docker save card-games:ci | gzip > card-games.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v7
        with:
          name: docker-image
          path: card-games.tar.gz
          retention-days: 1

  docker-smoke:
    name: Docker Smoke Test
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download image artifact
        uses: actions/download-artifact@v8
        with:
          name: docker-image

      - name: Load Docker image
        run: docker load < card-games.tar.gz

      - name: Start services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/healthcheck; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose -f docker-compose.test.yml logs
          exit 1

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run smoke test
        run: pnpm --filter @repo/web exec playwright test --config=playwright.smoke.config.ts
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-traces
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down
