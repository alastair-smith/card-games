name: Deploy to instance

on:
  workflow_call:
    inputs:
      image_tag:
        required: true
        type: string

jobs:
  deploy:
    name: Deploy ${{ inputs.image_tag }} to OCI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          oauth-client-id: ${{ secrets.TAILSCALE_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TAILSCALE_OAUTH_SECRET }}
          tags: tag:github-actions

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.OCI_SSH_PRIVATE_KEY }}

      - name: Add server to known_hosts
        run: ssh-keyscan -H "${{ secrets.OCI_TAILSCALE_IP }}" >> ~/.ssh/known_hosts

      - name: Write .env file
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          NEW_RELIC_LICENSE_KEY: ${{ secrets.NEW_RELIC_LICENSE_KEY }}
          OTEL_EXPORTER_OTLP_ENDPOINT: ${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}
          ADMIN_USERNAME: ${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
        run: |
          cat > /tmp/deploy.env << EOF
          AUTH_SECRET=${AUTH_SECRET}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          REDIS_CONNECTION_STRING=redis://:${REDIS_PASSWORD}@redis:6379
          DOCKERHUB_IMAGE=${DOCKERHUB_USERNAME}/card-games
          IMAGE_TAG=${IMAGE_TAG}
          OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
          NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
          LOG_LEVEL=info
          ADMIN_USERNAME=${ADMIN_USERNAME}
          ADMIN_PASSWORD=${ADMIN_PASSWORD}
          EOF

      - name: Upload compose files and env to server
        run: |
          rsync -az \
            docker-compose.prod.yml \
            infrastructure/Caddyfile \
            /tmp/deploy.env \
            "ubuntu@${{ secrets.OCI_TAILSCALE_IP }}:/opt/card-games/"

      - name: Deploy
        run: |
          ssh "ubuntu@${{ secrets.OCI_TAILSCALE_IP }}" bash << 'SSHEOF'
            set -euo pipefail
            cd /opt/card-games
            mv deploy.env .env
            chmod 600 .env
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans
          SSHEOF

      - name: Verify health check
        run: |
          ssh "ubuntu@${{ secrets.OCI_TAILSCALE_IP }}" bash << 'SSHEOF'
            for i in $(seq 1 20); do
              if curl -sf http://localhost:3000/api/healthcheck > /dev/null; then
                echo "Health check passed"
                exit 0
              fi
              echo "Attempt $i/20 failed, waiting 5s..."
              sleep 5
            done
            echo "Health check did not pass after 100s"
            docker compose -f /opt/card-games/docker-compose.prod.yml logs --tail=50
            exit 1
          SSHEOF
