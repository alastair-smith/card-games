name: CI

on:
  - pull_request

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run test
        run: pnpm test

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    env:
      REDIS_CONNECTION_STRING: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run integration tests
        run: pnpm turbo run test:integration

  ui-tests:
    name: UI Tests (${{ matrix.project }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - project: chromium
            browser: chromium
          - project: chromium-mobile
            browser: chromium
          - project: firefox
            browser: firefox
          - project: firefox-mobile
            browser: firefox
    env:
      NEXT_PUBLIC_API_MOCKING: enabled
      PORT: '3001'
      AUTH_SECRET: ci-test-secret-placeholder-at-least-32ch
      REDIS_CONNECTION_STRING: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install ${{ matrix.browser }}
      - name: Run UI flow tests
        run: pnpm --filter @repo/web test:ui --project=${{ matrix.project }}

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - name: Run build
        run: pnpm build
