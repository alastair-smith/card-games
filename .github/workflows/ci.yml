name: CI

on:
  - pull_request

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(🚀|🔧|📚|🐛)[[:space:]][A-Z] ]]; then
            echo "::error::PR title must start with one of 🚀 🔧 📚 🐛 followed by a space and a capital letter."
            echo "Examples:"
            echo "  🚀 Add new feature"
            echo "  🐛 Fix card rendering bug"
            echo "  🔧 Update dependencies"
            echo "  📚 Document API endpoints"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm lint

  changes:
    name: Detect App Changes
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Check for app changes
        id: filter
        # Pull request runs check out the merge commit, so its first parent is the base branch
        run: |
          app_paths=(
            apps/web/
            packages/
            package.json
            pnpm-lock.yaml
            pnpm-workspace.yaml
            turbo.json
            .github/workflows/
            .github/actions/
          )
          changed_files=$(git diff --name-only HEAD^1 HEAD -- "${app_paths[@]}")
          if [[ -n "$changed_files" ]]; then
            echo "App changes:"
            echo "$changed_files"
            echo "app=true" >> "$GITHUB_OUTPUT"
          else
            echo "No app changes"
            echo "app=false" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run test
        run: pnpm test

  test-stories:
    name: Story Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - name: Run story tests
        run: pnpm --filter @repo/web test:stories

  test-integration:
    name: Integration Tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    env:
      REDIS_CONNECTION_STRING: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run integration tests
        run: pnpm turbo run test:integration

  build:
    name: Build
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
      - name: Cache build output
        uses: actions/cache/save@v6
        with:
          key: next-build-${{ github.sha }}
          path: apps/web/.next

  # Separate jobs rather than a matrix, so each check has the same name whether
  # it runs or is skipped and can be required on main
  test-e2e-chromium-desktop:
    name: E2E Tests (chromium-desktop)
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services: &e2e-services
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    env: &e2e-env
      REDIS_CONNECTION_STRING: redis://localhost:6379
      AUTH_SECRET: "test-secret-at-least-32-characters-long!!"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          project: chromium-desktop
          browser: chromium

  test-e2e-chromium-mobile:
    name: E2E Tests (chromium-mobile)
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services: *e2e-services
    env: *e2e-env
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          project: chromium-mobile
          browser: chromium

  test-e2e-firefox-desktop:
    name: E2E Tests (firefox-desktop)
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services: *e2e-services
    env: *e2e-env
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          project: firefox-desktop
          browser: firefox

  test-e2e-firefox-mobile:
    name: E2E Tests (firefox-mobile)
    needs: [changes, build]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    services: *e2e-services
    env: *e2e-env
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/e2e
        with:
          project: firefox-mobile
          browser: firefox
