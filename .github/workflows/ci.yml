name: CI

on:
  - pull_request

jobs:
  pr-title:
    name: PR Title
    runs-on: ubuntu-latest
    steps:
      - name: Check PR title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [[ ! "$PR_TITLE" =~ ^(🚀|🔧|📚|🐛)[[:space:]][A-Z] ]]; then
            echo "::error::PR title must start with one of 🚀 🔧 📚 🐛 followed by a space and a capital letter."
            echo "Examples:"
            echo "  🚀 Add new feature"
            echo "  🐛 Fix card rendering bug"
            echo "  🔧 Update dependencies"
            echo "  📚 Document API endpoints"
            exit 1
          fi

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run test
        run: pnpm test

  test-stories:
    name: Story Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium
      - name: Run story tests
        run: pnpm --filter @repo/web test:stories

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    env:
      REDIS_CONNECTION_STRING: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run integration tests
        run: pnpm turbo run test:integration

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Run build
        run: pnpm build
        env:
          SKIP_ENV_VALIDATION: "true"
      - name: Cache build output
        uses: actions/cache/save@v6
        with:
          key: next-build-${{ github.sha }}
          path: apps/web/.next

  test-e2e:
    name: E2E Tests (${{ matrix.project }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - chromium-desktop
          - chromium-mobile
          - firefox-desktop
          - firefox-mobile
        include:
          - project: chromium-desktop
            browser: chromium
          - project: chromium-mobile
            browser: chromium
          - project: firefox-desktop
            browser: firefox
          - project: firefox-mobile
            browser: firefox
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    env:
      REDIS_CONNECTION_STRING: redis://localhost:6379
      AUTH_SECRET: "test-secret-at-least-32-characters-long!!"
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Restore build output
        uses: actions/cache/restore@v6
        with:
          key: next-build-${{ github.sha }}
          path: apps/web/.next
          fail-on-cache-miss: true
      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps ${{ matrix.browser }}
      - name: Run E2E tests
        run: pnpm --filter @repo/web test:e2e --project=${{ matrix.project }}
      - name: Upload Playwright trace
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces-${{ matrix.project }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 1

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t card-games:ci .

      - name: Start services
        run: docker compose -f docker-compose.test.yml up -d

      - name: Wait for app to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/healthcheck; then
              echo "App is healthy"
              exit 0
            fi
            sleep 2
          done
          echo "App did not become healthy in time"
          docker compose -f docker-compose.test.yml logs
          exit 1

      - uses: ./.github/actions/setup

      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install --with-deps chromium

      - name: Run smoke test
        run: pnpm --filter @repo/web exec playwright test --config=playwright.smoke.config.ts
        env:
          BASE_URL: http://localhost:3000

      - name: Upload Playwright traces
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-smoke-traces
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 1

      - name: Stop services
        if: always()
        run: docker compose -f docker-compose.test.yml down
