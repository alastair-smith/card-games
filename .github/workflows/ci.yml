name: CI

on:
  - pull_request

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run lint
        run: pnpm lint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run test
        run: pnpm test

  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:alpine
        ports:
          - 6379:6379
    env:
      REDIS_CONNECTION_STRING: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run integration tests
        run: pnpm turbo run test:integration

  ui-flow-tests:
    name: UI Flow Tests
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_API_MOCKING: enabled
      PORT: '3001'
      AUTH_SECRET: ci-test-secret-placeholder-at-least-32ch
      REDIS_CONNECTION_STRING: redis://localhost:6379
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install Playwright browsers
        run: pnpm --filter @repo/web exec playwright install chromium
      - name: Run UI flow tests
        run: pnpm --filter @repo/web test:e2e

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Run build
        run: pnpm build
