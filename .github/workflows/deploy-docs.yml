name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - apps/docs/**
      - .github/workflows/deploy-docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-docs
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # The environment only allows main, so its Cloudflare secrets can't be
    # read from a workflow run on any other branch
    environment:
      name: docs
      url: https://docs.playcards.games
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - name: Build docs
        run: pnpm --filter @repo/docs build:docs
      - name: Deploy to Cloudflare
        run: pnpm --filter @repo/docs deploy:docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
