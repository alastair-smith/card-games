name: Label issues

on:
  issues:
    types:
      - opened
      - edited

permissions:
  issues: write

jobs:
  area:
    name: Label by area
    if: github.event.action == 'opened' || github.event.changes.body
    runs-on: ubuntu-latest
    steps:
      - name: Set label from the area dropdown
        uses: actions/github-script@v9
        with:
          script: |
            const labelsByArea = {
              Yaniv: 'yaniv',
              Lobby: 'lobby',
              'Home page': 'home page',
              Other: 'other',
            };
            const { issue } = context.payload;
            const match = (issue.body ?? '').match(/### What does it relate to\?\s+(.+)/);
            const label = match && labelsByArea[match[1].trim()];
            if (!label) {
              return;
            }
            const areaLabels = Object.values(labelsByArea);
            const staleLabels = issue.labels
              .map(({ name }) => name)
              .filter((name) => areaLabels.includes(name) && name !== label);
            for (const name of staleLabels) {
              await github.rest.issues.removeLabel({
                ...context.repo,
                issue_number: issue.number,
                name,
              });
            }
            await github.rest.issues.addLabels({
              ...context.repo,
              issue_number: issue.number,
              labels: [label],
            });
