name: 🔧 Chore
description: Maintenance, refactoring, tooling or other work that isn't a bug or feature
labels: [chore]
body:
  - type: dropdown
    id: area
    attributes:
      label: What does it relate to?
      options:
        - Yaniv
        - Lobby
        - Home page
        - Other
    validations:
      required: true
  - type: textarea
    id: task
    attributes:
      label: What needs doing?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why?
      description: What it improves, or what goes wrong if it isn't done.
    validations:
      required: false
