version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    # Waiting a week lets compromised or broken releases be pulled before we
    # pick them up. Security updates ignore this and open straight away.
    cooldown:
      default-days: 7
    commit-message:
      prefix: 🔧
    labels:
      - chore
      - other
    # Node types must match the Node runtime major in .node-version, so they
    # only move when the runtime does.
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - version-update:semver-major
    # A dependency joins the first group it matches, so minor and patch
    # updates all land in one PR and the groups below only see majors. Those
    # group packages that release in lockstep and must move together.
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
      vitest:
        patterns:
          - vitest
          - '@vitest/*'
      storybook:
        patterns:
          - storybook
          - '@storybook/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      trpc:
        patterns:
          - '@trpc/*'
      opentelemetry:
        patterns:
          - '@opentelemetry/*'
      playwright:
        patterns:
          - playwright
          - '@playwright/test'
      tailwind:
        patterns:
          - tailwindcss
          - '@tailwindcss/*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: 🔧
    labels:
      - chore
      - other
    groups:
      github-actions:
        patterns:
          - '*'
