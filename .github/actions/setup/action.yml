name: 'Setup Environment'
description: 'Checkout, setup node and pnpm, and install dependencies'
runs:
  using: "composite"
  steps:
    - name: Read versions
      id: versions
      shell: bash
      run: |
        echo "PNPM_VERSION=$(grep pnpm .tool-versions | cut -d' ' -f2)" >> $GITHUB_OUTPUT
    - name: Setup PNPM
      uses: pnpm/action-setup@v5
      with:
        version: ${{ steps.versions.outputs.PNPM_VERSION }}
    - name: Setup Node
      uses: actions/setup-node@v5
      with:
        node-version-file: .node-version
        cache: 'pnpm'
    - name: Install dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
